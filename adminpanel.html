<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNAP PRINT | Admin Panel</title>
<style>
:root{--orange:#f47b00;--ink:#202124;--muted:#73777d;--bg:#f5f6f8;--line:#e8e9ec;--white:#fff;--green:#16803c;--red:#c0392b;--blue:#315f98}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.top{max-width:1200px;margin:auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-weight:900;letter-spacing:.3px;font-size:21px}.brand span{color:var(--orange)}.sub{font-size:12px;color:var(--muted);margin-top:3px}.refresh{border:0;border-radius:10px;background:#fff3e5;color:#b65d00;padding:10px 14px;font-weight:700;cursor:pointer}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}.heading h1{margin:0;font-size:25px}.heading p{margin:6px 0 0;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px}.stat .label{font-size:12px;color:var(--muted)}.stat .num{font-size:27px;font-weight:800;margin-top:6px}.stat .accent{color:var(--orange)}.toolbar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{border:1px solid #ddd;background:#fff;padding:11px 12px;border-radius:10px;min-width:160px;flex:1}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer;color:#555;font-weight:700;font-size:13px}.tab.active{background:var(--orange);color:white;border-color:var(--orange)}#orders{display:grid;gap:13px}.order{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.orderhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.orderid{font-weight:800;font-size:15px}.meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}.status{font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px;white-space:nowrap}.status.NEW{background:#fff4e5;color:#b65d00}.status.PRINTING{background:#eaf1ff;color:#2458a4}.status.COMPLETED{background:#e8f6ec;color:#18743a}.files{display:grid;gap:8px;margin-top:13px}.file{border:1px solid #eee;border-radius:12px;padding:11px;display:flex;align-items:center;gap:11px;min-width:0}.fileicon{width:37px;height:37px;background:#f4f5f7;border-radius:10px;display:grid;place-items:center;font-size:17px;flex-shrink:0}.fileinfo{min-width:0;flex:1}.filename{font-size:13px;font-weight:700;overflow-wrap:anywhere}.filetype{font-size:11px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:6px;flex-wrap:wrap}.action{border:0;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer}.open{background:#edf3ff;color:#28599e}.delete{background:#fff0f0;color:#b42318}.empty,.loading,.error{background:#fff;border:1px solid var(--line);border-radius:14px;text-align:center;padding:35px 15px;color:var(--muted)}.error{color:#b42318;background:#fff5f5}.orderfooter{border-top:1px solid #eee;margin-top:13px;padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.instructions{font-size:12px;color:#555;max-width:70%;white-space:pre-wrap}.statusselect{border:1px solid #ddd;border-radius:9px;padding:9px;background:#fff;font-size:12px;font-weight:700}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#202124;color:white;padding:12px 16px;border-radius:11px;display:none;z-index:20;box-shadow:0 5px 20px #0002}.modalbg{display:none;position:fixed;inset:0;background:#0007;z-index:15;align-items:center;justify-content:center;padding:18px}.modal{background:white;border-radius:15px;max-width:420px;width:100%;padding:20px}.modal h3{margin:0 0 10px}.modal p{font-size:14px;line-height:1.5;color:#555}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.modalactions button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.cancel{background:#f0f1f3}.confirm{background:#d93b31;color:white}.foot{text-align:center;color:#9a9a9a;font-size:11px;padding:20px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.heading{align-items:flex-start;flex-direction:column}.order{padding:13px}.file{align-items:flex-start}.actions{width:100%}.action{flex:1}.instructions{max-width:100%}.orderfooter{align-items:stretch;flex-direction:column}.statusselect{width:100%}}
</style></head><body>
<header><div class="top"><div><div class="brand">SNAP <span>PRINT</span></div><div class="sub">Order Management · Admin</div></div><button class="refresh" onclick="loadOrders()">↻ Refresh Orders</button></div></header>
<main class="wrap"><div class="heading"><div><h1>Print Orders</h1><p>Review customer uploads, open files and manage order status.</p></div><div id="lastUpdated" class="sub"></div></div>
<section class="stats"><div class="stat"><div class="label">Total Orders</div><div class="num" id="total">—</div></div><div class="stat"><div class="label">New</div><div class="num accent" id="newCount">—</div></div><div class="stat"><div class="label">Printing</div><div class="num" id="printingCount">—</div></div><div class="stat"><div class="label">Completed</div><div class="num" id="completedCount">—</div></div></section>
<div class="toolbar"><input id="search" placeholder="Search order, customer, mobile or file…" oninput="render()"><select id="typeFilter" onchange="render()"><option value="ALL">All Print Types</option><option value="BLACK_WHITE">Black &amp; White</option><option value="COLOUR">Colour</option></select></div>
<div class="tabs"><button class="tab active" data-status="ALL" onclick="setTab(this)">All Orders</button><button class="tab" data-status="NEW" onclick="setTab(this)">New</button><button class="tab" data-status="PRINTING" onclick="setTab(this)">Printing</button><button class="tab" data-status="COMPLETED" onclick="setTab(this)">Completed</button><button class="tab" data-type="BLACK_WHITE" onclick="setTab(this)">Black &amp; White</button><button class="tab" data-type="COLOUR" onclick="setTab(this)">Colour</button></div>
<div id="orders"><div class="loading">Loading orders…</div></div></main><div class="foot">SNAP PRINT · Admin Panel</div><div class="toast" id="toast"></div>
<div class="modalbg" id="modalbg"><div class="modal"><h3 id="modalTitle">Confirm action</h3><p id="modalText"></p><div class="modalactions"><button class="cancel" onclick="closeModal()">Cancel</button><button class="confirm" id="modalConfirm">Confirm</button></div></div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbylhiZhCV5aH5406te9LRsgTPLq34x4znjVgxnQIWqM_fiBhUV11hgk4bAaKAFpSc7HYg/exec";
let allOrders=[],statusTab="ALL",typeTab="ALL",pendingAction=null;
function api(action,payload={}){return new Promise((resolve,reject)=>{const cb="snapprint_cb_"+Date.now()+"_"+Math.floor(Math.random()*10000),script=document.createElement("script");let timer=setTimeout(()=>{cleanup();reject(new Error("Server timed out. Check Apps Script deployment."))},20000);function cleanup(){clearTimeout(timer);delete window[cb];script.remove()}window[cb]=res=>{cleanup();res?.success?resolve(res):reject(new Error(res?.message||"API error"))};script.onerror=()=>{cleanup();reject(new Error("Could not reach Apps Script backend."))};script.src=API_URL+"?"+new URLSearchParams({action,callback:cb,payload:JSON.stringify(payload)});document.body.appendChild(script)})}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(s){const t=document.getElementById("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",2600)}
function normalize(raw){const groups={};(raw||[]).forEach(r=>{let id=r.Order_ID||r.orderId||r.order_id||r.OrderID||"UNKNOWN";if(!groups[id])groups[id]={orderId:id,timestamp:r.Timestamp||r.timestamp||"",customerName:r.Customer_Name||r.customerName||"",mobile:r.Mobile||r.mobile||"",printType:r.Print_Type||r.printType||"BLACK_WHITE",instructions:r.Instructions||r.instructions||"",status:r.Status||r.status||"NEW",files:[]};groups[id].files.push({fileName:r.File_Name||r.fileName||"File",fileUrl:r.File_URL||r.fileUrl||"",rowNumber:r.rowNumber||r.row||null})});return Object.values(groups)}
async function loadOrders(){document.getElementById("orders").innerHTML='<div class="loading">Refreshing orders…</div>';try{const r=await api("adminGetOrders");allOrders=normalize(r.orders||r.data||[]);updateStats();render();document.getElementById("lastUpdated").textContent="Updated "+new Date().toLocaleTimeString();}catch(e){document.getElementById("orders").innerHTML='<div class="error">'+esc(e.message)+'<br><br>If the backend is Version 4.1, check the deployment URL and web app access permissions.</div>';}}
function updateStats(){document.getElementById("total").textContent=allOrders.length;document.getElementById("newCount").textContent=allOrders.filter(o=>o.status==="NEW").length;document.getElementById("printingCount").textContent=allOrders.filter(o=>o.status==="PRINTING").length;document.getElementById("completedCount").textContent=allOrders.filter(o=>o.status==="COMPLETED").length}
function setTab(el){document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));el.classList.add("active");statusTab=el.dataset.status||"ALL";typeTab=el.dataset.type||"ALL";render()}
function render(){const q=document.getElementById("search").value.toLowerCase().trim(),type=document.getElementById("typeFilter").value;const list=allOrders.filter(o=>(statusTab==="ALL"||o.status===statusTab)&&(typeTab==="ALL"||o.printType===typeTab)&&(type==="ALL"||o.printType===type)&&(!q||[o.orderId,o.customerName,o.mobile,...o.files.map(f=>f.fileName)].join(" ").toLowerCase().includes(q)));if(!list.length){document.getElementById("orders").innerHTML='<div class="empty">No matching print orders.</div>';return}document.getElementById("orders").innerHTML=list.map(o=>card(o)).join("")}
function card(o){const date=o.timestamp?new Date(o.timestamp).toLocaleString():"Date not available";return `<article class="order"><div class="orderhead"><div><div class="orderid">${esc(o.orderId)}</div><div class="meta">${esc(o.customerName||"Customer")}${o.mobile?" · "+esc(o.mobile):""} · ${esc(date)}<br>${o.printType==="COLOUR"?"Colour Print":"Black & White"} · ${o.files.length} file(s)</div></div><span class="status ${esc(o.status)}">${esc(o.status)}</span></div><div class="files">${o.files.map((f,i)=>`<div class="file"><div class="fileicon">▤</div><div class="fileinfo"><div class="filename">${esc(f.fileName)}</div><div class="filetype">Document ${i+1} of ${o.files.length}</div></div><div class="actions"><button class="action open" onclick="openFile('${encodeURIComponent(f.fileUrl)}')">Open / Print</button><button class="action delete" onclick="askDelete('${encodeURIComponent(o.orderId)}','${encodeURIComponent(f.fileName)}')">Delete</button></div></div>`).join("")}</div><div class="orderfooter"><div class="instructions">${o.instructions?"Instructions: "+esc(o.instructions):"No special instructions"}</div><select class="statusselect" onchange="changeStatus('${encodeURIComponent(o.orderId)}',this.value)" aria-label="Change order status"><option value="NEW" ${o.status==="NEW"?"selected":""}>Mark as New</option><option value="PRINTING" ${o.status==="PRINTING"?"selected":""}>Mark as Printing</option><option value="COMPLETED" ${o.status==="COMPLETED"?"selected":""}>Mark as Completed</option></select></div></article>`}
function openFile(u){const url=decodeURIComponent(u);if(!url){toast("File URL unavailable");return}window.open(url,"_blank","noopener")}
function askDelete(order,file){const oid=decodeURIComponent(order),fn=decodeURIComponent(file);document.getElementById("modalTitle").textContent="Delete this file?";document.getElementById("modalText").textContent=`${fn} will be removed from this order and moved to Google Drive Trash.`;document.getElementById("modalConfirm").onclick=()=>doDelete(oid,fn);document.getElementById("modalbg").style.display="flex"}
function closeModal(){document.getElementById("modalbg").style.display="none";pendingAction=null}
async function doDelete(orderId,fileName){closeModal();try{await api("adminDeleteFile",{orderId,fileName});toast("File deleted");await loadOrders()}catch(e){toast("Delete failed: "+e.message)}}
async function changeStatus(orderId,status){const oid=decodeURIComponent(orderId);try{await api("adminUpdateStatus",{orderId:oid,status});toast("Status updated");await loadOrders()}catch(e){toast("Status update failed: "+e.message);render()}}
loadOrders();
</script></body></html>
